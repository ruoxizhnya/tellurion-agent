# ai-service 配置（AI 拆仓阶段 1，ADR-027 §5 第 8 步的前置切片）。
#
# 只承载 AI 实验员侧（cmd/ai）：Copilot / pipeline / explore / tools。
# 引擎装配（risk_manager / backtest / trading / database）与
# analysis-service.yaml **逐值一致** —— 同一个实验在两个进程跑出
# 不同结果是不可接受的；改一处必须同步另一处（两处都读同名键）。
#
# 宿主机直跑视角（数据库/缓存在 localhost），与 analysis-service.yaml
# 同一口径；容器内由 docker-compose 的 env 覆盖。

server:
  host: "0.0.0.0"
  port: 8086
  gin_mode: "release"
  cors:
    allowed_origins: []

# P0-4 鉴权（与 analysis 同一套不变量：无密钥拒启动，豁免须显式声明）。
# 密钥只从 env 注入：JWT_SECRET / AUTH_INSECURE / AUTH_INSECURE_EXPOSURE。
auth:
  jwt_secret: ""
  allow_insecure: false
  insecure_exposure: ""
  issuer: "tellurion"
  access_token_ttl: 15m
  refresh_token_ttl: 168h      # 7d

rate_limit:
  per_minute: 100

# 数据库。口令**只能**从 env 注入（DATABASE_PASSWORD），本文件永远留空：
# 它是入库的，写空串不是「随便填」，而是让 kitdb.BuildDSN 在启动期就
# 拒绝空口令（fail-closed），而不是拖到连接时才报认证失败。
#
# 本机直跑（宿主 PG，scram-sha-256）的最小注入：
#   DATABASE_PASSWORD=<本机 postgres 用户的口令>
# 需要覆盖整个连接串时才用 DATABASE_URL（逐字段拼装的替代品）；
# 两者都给时 url 优先（kitdb.BuildDSN 的约定）。容器里由 compose 的
# environment 注入，见 deploy/compose.yaml。
database:
  url: ""
  host: "localhost"
  port: 5432
  user: "postgres"
  password: ""
  database: "tellurion"
  sslmode: "disable"

# 服务间地址：**本文件是宿主机直跑视角**（与 database / redis 同口径）。
# 容器里由 deploy/compose.yaml 的 env 覆盖成服务名（compose 服务名只在
# 容器网络内可解析）。启动期逐项解析（cmd/ai/endpoints.go），宿主机上留着
# 容器 DNS 会直接报错并点名该注入哪个 env，而不是在第一次工具调用时远处 404。
#
#   key                      env 覆盖名                宿主机默认
#   data_service.url         DATA_SERVICE_URL          http://127.0.0.1:8081
#   ai_service.factor_api_url AI_SERVICE_FACTOR_API_URL http://127.0.0.1:8085
#   strategy_asset.url       STRATEGY_ASSET_URL        http://127.0.0.1:8090
data_service:
  url: "http://127.0.0.1:8081"

# ai-service 自己的地址视图：
#   factor_api_url —— factor.compute / factor.evaluate / compute_factor_ic
#   三个工具经 HTTP 打 analysis 的 /api/factor/*（只在那里注册）。
ai_service:
  factor_api_url: "http://127.0.0.1:8085"

# 与 analysis-service.yaml 逐值一致（回测行为对等的来源）。
risk_manager:
  target_volatility: 0.15
  max_position_weight: 0.10
  min_position_weight: 0.01
  stoploss:
    atr_period: 14
    base_multiplier: 2.5
    bull_multiplier: 2.0
    bear_multiplier: 3.5
    sideways_multiplier: 2.5
  take_profit:
    atr_multiplier: 3.0
  volatility:
    lookback_days: 20
    annualization_factor: 16.0
  regime:
    fast_ma_period: 10
    slow_ma_period: 20
    vol_lookback: 60

backtest:
  initial_capital: 1000000.0
  commission_rate: 0.0003
  slippage_rate: 0.0001
  risk_free_rate: 0.03

# 引擎读顶层 trading 键（v.UnmarshalKey("trading", ...)）—— 与
# analysis-service.yaml **逐值一致**（详见那边 AUD-37 / AUD-06 注记；
# 改这里必须同步那边，反之亦然）。
trading:
  # 印花税（仅卖出）：0.05%。2023-08-28 起从 0.1% 减半。
  stamp_tax_rate: 0.0005
  stamp_tax_rate_before: 0.001
  min_commission: 5.0            # 最低佣金 5元
  transfer_fee_rate: 0.00001     # 过户费 0.001%
  price_limit:
    normal: 0.10                 # 主板股票涨跌幅限制 ±10%
    st: 0.10                     # 主板 ST 涨跌幅限制 ±10%（2026-07-06 起）
    st_before: 0.05              # 主板 ST 涨跌幅限制 ±5%（2026-07-06 之前）
    new: 0.20                    # 新股涨跌幅限制 ±20%
  new_stock_days: 60             # 新股判断阈值（已知不准，见 TASKS AUD-07）
  # ai-service 不暴露下单端点，emergency_token 与 execution 无关；键保留
  # 只为与 analysis 的引擎装配假设完全一致。
  emergency_token: ""

copilot:
  # LLM 生成代码的编译沙箱目录，必须含能解析
  # github.com/ruoxizhnya/tellurion-contracts/domain 的 go.mod（QT-05 B1 起 domain
  # 类型住在契约仓，本仓已无 pkg/domain；消费方实现以 tellurion-agent 的 copilot 为准）。
  # 空 = 拒绝构建（fail closed, status="sandbox_rejected"）。
  working_dir: ""

# QT-32-B：AI 生成物登记到 tellurion-strategy 的资产服务（拿服务端签发的
# strategy_id / version_hash；产物载体再加 artifact_hash）。
#   url 为空 = 登记端口未注入 ⇒ 编译通过后 fail-closed（不产出无坐标的产物）。
#   carrier 按 2026-10-25 第三轮裁决 ⑩：默认 dsl，仅 L3 才 wasm（那时必须给
#   abi_version 与 toolchain）。dsl / builtin / external 不产字节码，不会调
#   build，artifact_hash 留空。
strategy_asset:
  # 宿主直跑默认本机 :8090；容器里由 compose 的 STRATEGY_ASSET_URL 覆盖成
  # 宿主网关（host.docker.internal:8090，该服务不在本栈内）。
  url: "http://127.0.0.1:8090"
  carrier: "dsl"
  abi_version: ""
  scope: "market"
  entry: "OnBar"
  toolchain: ""
  poll_interval: 1s
  poll_timeout: 2m

logging:
  level: "info"
  format: "json"
