name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # 单一 Go job：build + vet + test。
  #
  # QT-17 S3-d 起本仓对 core **零编译依赖**（go.mod 无 require / replace），
  # CI 不再 checkout core、也不再改写 replace —— 单仓 checkout 即可构建
  # （R1/R2）。
  test:
    name: Build / vet / test
    runs-on: ubuntu-latest
    # AGENT-CI-GATES：库侧用例不再长期 skip——起真 PG，Test 全腿带 DSN 跑。
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tellurion_agent_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_DSN: postgres://postgres:postgres@127.0.0.1:5432/tellurion_agent_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.11"
          cache: true

      # AGENT-CI-GATES：格式门（非空即红）。
      - name: Gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "gofmt needed for:"
            echo "$unformatted"
            exit 1
          fi

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      # X-DEP-BUMP-CONSUMERS：依赖漏洞门（kit v0.5.0 起要求 go 1.26.11）。
      # govulncheck 按“符号级可达性”判定，只对真正被调用到的漏洞报红。
      - name: Govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

      # AGENT-CI-GATES：Test 前应用本仓迁移。合法入口只有 pkg/aistore 的
      # Migrate（store.go 启动时也调它），复用现成的迁移幂等用例，不手写 SQL。
      - name: Migrate（aistore.Migrate）
        run: go test ./pkg/aistore -run '^TestMigrate_Integration$' -count=1 -v

      # -p 1：真库腿共享同一个 ai.* schema（ai.experiments 等），跨包并行会
      # 互相污染计数/行数（实测并行时 experiment_count 6≠7、loop 行数 1≠5）。
      - name: Test
        run: go test ./... -count=1 -p 1 -coverprofile=coverage.out

      # AGENT-CI-GATES：覆盖率门。阈值来源见 AGENTS.md §2：2026-11-13 隔离
      # PG 16 真跑全套件实测 65.6%，取整 65 − 5 = 60。
      - name: Coverage gate
        run: |
          total="$(go tool cover -func=coverage.out | tail -n 1 | awk '{print $3}' | tr -d '%')"
          echo "total coverage: ${total}% (floor: 60%)"
          if [ -z "$total" ]; then
            echo "coverage total not parsed from coverage.out"
            exit 1
          fi
          awk -v total="$total" 'BEGIN { if (total + 0 < 60) { printf "coverage %.1f%% is below the 60%% floor\n", total; exit 1 } }'

      - name: Test（-race，数据竞争即红）
        run: go test -race ./... -count=1 -p 1

      - name: Staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@latest
          "$(go env GOPATH)/bin/staticcheck" ./...
