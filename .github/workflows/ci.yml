name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # 单一 Go job：build + vet + test。
  #
  # QT-17 S3-d 起本仓对 core **零编译依赖**（go.mod 无 require / replace），
  # CI 不再 checkout core、也不再改写 replace —— 单仓 checkout 即可构建
  # （R1/R2）。
  test:
    name: Build / vet / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.11"
          cache: true

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      # X-DEP-BUMP-CONSUMERS：依赖漏洞门（kit v0.5.0 起要求 go 1.26.11）。
      # govulncheck 按“符号级可达性”判定，只对真正被调用到的漏洞报红。
      - name: Govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

      - name: Test
        run: go test ./... -count=1
