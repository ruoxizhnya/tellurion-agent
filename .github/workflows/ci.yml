name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # 单一 Go job：build + vet + test。
  #
  # QT-17 S3-d 起本仓对 core **零编译依赖**（go.mod 无 require / replace），
  # CI 不再 checkout core、也不再改写 replace —— 单仓 checkout 即可构建
  # （R1/R2）。
  test:
    name: Build / vet / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -count=1
