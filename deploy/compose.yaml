# tellurion-agent · 单仓本地运行（ADR-036 G0）
# 用法：docker compose -f deploy/compose.yaml up --build
# 依赖：本文件自带 PostgreSQL（仅本仓自用）；ai-service 经
# wait-for-deps.sh 等它就绪后再启动。**本仓无 Redis 读取点**（Go 代码零 import；
# `go-redis` 只是 kit/db 的间接依赖），故不提供 redis 服务、不注入 REDIS_URL。
# 端口：ai-service 只发布到 127.0.0.1:8086；PG 用非默认宿主端口，
# 避免与本机原生 PG 5432 撞号。容器内仍用服务名与标准端口。
name: tellurion-agent

services:
  postgres:
    image: postgres:17.5-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-tellurion}
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - agent-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  ai-service:
    build:
      context: ..
      dockerfile: Dockerfile
    image: tellurion-agent:dev
    entrypoint: ["/bin/sh", "/app/deploy/wait-for-deps.sh"]
    command: ["/app/ai-service"]
    ports:
      - "127.0.0.1:8086:8086"
    environment:
      # 配置读本仓副本（不再借 ../tellurion/config）。
      CONFIG_PATH: /app/config/ai-service.yaml
      # 容器内地址：服务名 + 标准端口；密钥/口令仍走 env（YAML 不入库密钥）。
      SERVER_HOST: 0.0.0.0
      DATABASE_HOST: postgres
      DATABASE_PORT: "5432"
      DATABASE_USER: ${POSTGRES_USER:-postgres}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      DATABASE_DATABASE: ${POSTGRES_DB:-tellurion}
      DATABASE_SSLMODE: disable
      # 容器必须绑 0.0.0.0；发布层限定回环，故按既有不变量声明 open-access。
      AUTH_INSECURE: ${AUTH_INSECURE:-true}
      AUTH_INSECURE_EXPOSURE: ${AUTH_INSECURE_EXPOSURE:-loopback-published}
      JWT_SECRET: ${JWT_SECRET:-}
      # 上游在本仓之外：analysis 反代面 / data-service 仍指向宿主。
      DATA_SERVICE_URL: ${DATA_SERVICE_URL:-http://host.docker.internal:8081}
      AI_SERVICE_FACTOR_API_URL: ${AI_SERVICE_FACTOR_API_URL:-http://host.docker.internal:8085}
      # QT-32-B：资产服务也在本仓之外（tellurion-strategy，默认 :8090）。
      STRATEGY_ASSET_URL: ${STRATEGY_ASSET_URL:-http://host.docker.internal:8090}
      # 资产服务写端点的 service token（core 的 tools/issue_service_token.go 签发）。
      # 空 = 不发 Authorization：公开期链路照旧；strategy 收紧写端点后必须注入。
      STRATEGY_ASSET_TOKEN: ${STRATEGY_ASSET_TOKEN:-}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_API_URL: ${AI_API_URL:-https://api.openai.com/v1/chat/completions}
      AI_MODEL: ${AI_MODEL:-}
      LOGGING_LEVEL: ${LOGGING_LEVEL:-info}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-100}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8086/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  agent-pgdata:
